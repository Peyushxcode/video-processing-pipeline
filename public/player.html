<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HLS Video Player</title>
</head>
<body>
    <h2>My Video Streaming Pipeline</h2>
    <div id="processing">
        <h3>Video Processing</h3>

        <p id="stage">Waiting...</p>

        <progress id="progressBar" value="0" max="100"></progress>

        <span id="progressText">0%</span>
    </div>

    <br>
    <video id="video" controls width="800"></video>

    <br><br>

    <label for="quality">Quality:</label>
    <select id="quality">
        <option value="-1">Auto</option>
    </select>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

    <script>
        let latestProgress = 0;
        let terminalState = false;
        const params = new URLSearchParams(window.location.search);

        const videoId = params.get("videoId");

        const progressBar = document.getElementById("progressBar");
        const progressText = document.getElementById("progressText");
        const stageText = document.getElementById("stage");
        const processingDiv = document.getElementById("processing");

        let playerInitialized = false;

        const initializePlayer = () => {
            if (playerInitialized) return;

            playerInitialized = true;

            const video = document.getElementById("video");
            const quality = document.getElementById("quality");

            const videoUrl = `/api/stream/${videoId}/master.m3u8`;

            if (Hls.isSupported()) {
                const hls = new Hls();

                hls.loadSource(videoUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    console.log("Available qualities:", hls.levels);

                    hls.levels.forEach((level, index) => {
                        const option = document.createElement("option");

                        option.value = index;
                        option.textContent = `${level.height}p`;

                        quality.appendChild(option);
                    });
                });

                quality.addEventListener("change", () => {
                    hls.currentLevel = Number(quality.value);
                });

            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = videoUrl;
            }
        };

        const updateProgressUI = (data) => {

            if (typeof data.progress === "number") {
                progressBar.value = data.progress;
                progressText.textContent = `${data.progress}%`;
            }

            if (data.status === "pending") {
                stageText.textContent = "Waiting in queue...";
            }

            if (data.status === "processing") {
                stageText.textContent = "Processing video...";
            }

            if (data.status === "completed") {
                progressBar.value = 100;
                progressText.textContent = "100%";
                stageText.textContent = "Ready to Play";

                initializePlayer();
            }

            if (data.status === "failed") {
                stageText.textContent = "Processing failed!";
            }
        };

        const connectToProgress = () => {

            const source = new EventSource(
                `/api/video/${videoId}/progress`
            );

            source.onopen = () => {
                console.log("SSE connection established");
            };

            source.onmessage = (event) => {

                const data = JSON.parse(event.data);

                console.log("SSE event received:", data);

                if (terminalState) return;

                const isTerminal =
                    data.status === "completed" ||
                    data.status === "failed";

                if (typeof data.progress === "number") {

                    if (!isTerminal && data.progress < latestProgress) {
                        return;
                    }

                    latestProgress = Math.max(
                        latestProgress,
                        data.progress
                    );

                    data.progress = latestProgress;
                }

                updateProgressUI(data);

                if (isTerminal) {
                    terminalState = true;
                    source.close();

                    console.log("SSE connection closed");
                }
            };

            source.onerror = (err) => {
                console.error("SSE connection error:", err);
            };
        };

        if (videoId) {
            connectToProgress();
        } else {
            stageText.textContent = "No video selected";
        }
    </script>
</body>
</html>
