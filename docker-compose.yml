services:
  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    env_file:
      - .env

    environment:
      PORT: 5200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongo:27017/video-pipeline

    expose:
      - "5200"

    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongo:27017/video-pipeline
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      WORKER_CONCURRENCY: 1

    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

    restart: unless-stopped

volumes:
  redis_data:
  mongo_data: